 if(mode==='cards'){
  const [word,zh,sentence]=vocabulary[card];
  panel.innerHTML='<div class="tools"><h2>翻图卡</h2><span class="badge">'+(card+1)+' / 20</span></div><p class="note">先看图说单词，再翻卡核对。</p>'
  +button('flip',image(card)+'<span class="chinese">'+zh+'</span>'+(flipped?'<span class="word">'+word+'</span><span>'+sentence+'</span>':'<span class="hint">点击翻卡</span>'),'class="flash" aria-expanded="'+flipped+'"')
  +'<div class="controls">'+button('card-prev','上一张',card===0?'disabled':'')+button('card-next',card===19?'去说句子':'下一张','class="primary"')+'</div>';
 }else if(mode==='speak'){
  const [id,cue,question,answer]=prompts[prompt];
  panel.innerHTML='<div class="tools"><h2>看图说句子</h2><span class="badge">'+(prompt+1)+' / '+prompts.length+'</span></div><p class="note">'+(prompt<6?'先找时间线索，再说完整句子。':'看数字，说出完整词组。')+'</p>'
  +'<div class="prompt">'+image(id,vocabulary[id][1])+'<div><span class="badge">'+cue+'</span></div><p class="sentence" lang="en">'+question+'</p>'+(revealed?'<div class="answer" role="status" lang="en">'+answer+'</div>':'')+'</div>'
  +'<div class="controls">'+button('prompt-prev','上一题',prompt===0?'disabled':'')+button('reveal',revealed?'收起答案':'看答案','aria-expanded="'+revealed+'"')+button('prompt-next',prompt===prompts.length-1?'去玩连连看':'下一题','class="primary"')+'</div>';
 }else{
  function column(side,items){
   return '<div class="column" aria-label="'+(side==='picture'?'图片':'单词')+'">'+items.map((id,i)=>{
    const done=matched.has(id),active=selected?.side===side&&selected.id===id;
    return button('pick',side==='picture'?image(id,vocabulary[id][1]):vocabulary[id][0]+(done?' ✓':''),'class="tile'+(done?' matched':'')+(active?' selected':'')+'" data-id="'+id+'" data-side="'+side+'" aria-pressed="'+active+'" '+(done?'disabled':''));
   }).join('')+'</div>';
  }
  panel.innerHTML='<div class="tools"><h2>图词连连看</h2><span class="badge">第 '+(round+1)+' / 4 轮 · '+matched.size+' / 5</span></div><p class="note">点一张图片，再点它对应的英文单词。</p>'
  +'<div class="board">'+column('picture',pictures)+column('word',words)+'</div><p class="status" role="status">'+message+'</p><div class="controls">'+button('restart','重玩本轮')+(matched.size===5?button('new-round',round===3?'再玩一遍':'下一轮','class="primary"'):'')+'</div>';
 }
}
function pick(side,id) {
 if(matched.has(id)) return;
 if(!selected||selected.side===side){
  selected=selected?.id===id&&selected.side===side?null:{side,id};message='';
 }else if(selected.id===id){
  matched.add(id);selected=null;message=matched.size===5?(round===3?'四轮完成！':'五对全部找到了！'):'配对成功！';
 }else{
  selected=null;message='这一对还不一样，再试一次。';
 }
}
document.querySelector('nav').addEventListener('click',e=>{
 const next=e.target.closest('[data-mode]')?.dataset.mode;
 if(types.includes(next)){mode=next;render()}
});
panel.addEventListener('click',e=>{
 const target=e.target.closest('[data-action]');
 if(!target||target.disabled)return;
 const {action,side,id}=target.dataset;
 switch(action){
 case 'flip':flipped=!flipped;break;
 case 'card-prev':card--;flipped=false;break;
 case 'card-next':if(card===19){mode='speak'}else{card++;flipped=false}break;
 case 'prompt-prev':prompt--;revealed=false;break;
 case 'reveal':revealed=!revealed;break;
 case 'prompt-next':if(prompt===prompts.length-1){mode='match'}else{prompt++;revealed=false}break;
 case 'pick':pick(side,Number(id));break;
 case 'restart':startRound(round);break;
 case 'new-round':startRound((round+1)%4);break;
 }
 render();
 const focus=action==='pick'?[...panel.querySelectorAll('[data-action="pick"]')].find(b=>!b.disabled&&b.dataset.side===side&&b.dataset.id===id):panel.querySelector('[data-action="'+action+'"]:not(:disabled)');
 (focus||panel.querySelector('button:not(:disabled)'))?.focus({preventScroll:true});
});
render();
</script></body></html>
